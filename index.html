<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>crazyhouse · jakeworldwide</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any" />
  <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crazyhouse.css?v=25" />
</head>
<body>

  <!-- The whole game lives in this 16:9 box -->
  <div class="frame" id="frame">

    <canvas id="view"></canvas>
    <div class="nv-layer" aria-hidden="true"></div>

    <!-- Camera overlay -->
    <div class="hud" aria-live="polite">
      <div class="hud-cam"><span id="camNum" data-osd="hud">CAM 01</span><span id="camName" data-osd="hud"></span></div>
      <div class="hud-rec" data-osd="hud"><i data-osd-dot></i>rec</div>
      <div class="hud-clock" id="clock" data-osd="hud">12:00 AM</div>
      <div class="hud-dots" id="dots" data-osd="hud"></div>
    </div>

    <button class="arrow prev" id="prev" data-osd="hud" aria-label="Previous camera">&lt;</button>
    <button class="arrow next" id="next" data-osd="hud" aria-label="Next camera">&gt;</button>

    <!-- bottom right: night vision, and reporting craziness in a room -->
    <div class="feed-controls">
      <button class="nv" id="nv" data-osd="hud" aria-label="Toggle night vision" aria-pressed="false">nv</button>
      <div class="report">
        <div class="report-list" id="reportList" hidden></div>   <!-- a button per room (main.js) -->
        <div class="report-msg" id="reportMsg" data-osd="hud" hidden></div>
        <button class="report-btn" id="reportBtn" data-osd="hud" aria-expanded="false">report craziness</button>
      </div>
    </div>

    <!-- Esc: the options menu, drawn into the feed like the rest of its text -->
    <div class="pause-menu" id="pauseMenu" data-osd="hud" hidden>
      <div class="pause-title" data-osd="hud">paused</div>
      <button id="resumeBt" data-osd="hud">resume</button>
      <button id="quitBt" data-osd="hud">quit to menu</button>
    </div>

    <!-- craziness: reported and confirmed, too much going on at once, and overload -->
    <div class="crazy-banner" id="crazyBanner" data-osd="top" hidden>THAT WAS CRAZY</div>
    <div class="crazy-warning" id="crazyWarning" data-osd="hud" hidden></div>
    <div class="dead-menu" id="deadMenu" hidden>
      <div class="dead-title" id="deadTitle" data-osd="dead">craziness overload</div>
      <button id="retryBt" data-osd="dead">try again</button>
      <button id="menuBt" data-osd="dead">main menu</button>
    </div>
    <div class="dead-menu won-menu" id="wonMenu" hidden>
      <div class="dead-title won-title" data-osd="won">CRAZINESS DEFEATED</div>
      <div class="won-buttons" id="wonButtons" hidden>
        <button id="againBt" data-osd="won">play again</button>
        <button id="wonMenuBt" data-osd="won">main menu</button>
      </div>
    </div>

    <div class="cut-flash" aria-hidden="true"></div>
    <div class="emp-flash" aria-hidden="true"></div>

    <!-- Title screen -->
    <section class="title" id="title">
      <a class="back" href="../">&lsaquo; games</a>
      <h1 data-osd="title">crazyhouse</h1>
      <button class="start" id="start">START</button>
    </section>

    <pre class="diag" id="diag" hidden></pre>   <!-- ?diag: what this device can do, and any problems -->

    <p class="no-gl-msg">This game needs WebGL, and this browser isn't giving it any.</p>

  </div>

  <script type="module" src="main.js?v=90"></script>
</body>
</html>
