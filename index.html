<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>crazyhouse · jakeworldwide</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any" />
  <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crazyhouse.css?v=11" />
</head>
<body>

  <!-- The whole game lives in this 16:9 box -->
  <div class="frame" id="frame">

    <canvas id="view"></canvas>
    <div class="nv-layer" aria-hidden="true"></div>

    <!-- Camera overlay -->
    <div class="hud" aria-live="polite">
      <div class="hud-cam"><span id="camNum">cam 1</span><span id="camName"></span></div>
      <div class="hud-rec"><i></i>rec</div>
      <div class="hud-clock" id="clock">12:00:00 am</div>
      <div class="hud-dots" id="dots"></div>
    </div>

    <button class="arrow prev" id="prev" aria-label="Previous camera">
      <svg viewBox="0 0 24 48" aria-hidden="true"><polyline points="18,4 6,24 18,44" /></svg>
    </button>
    <button class="arrow next" id="next" aria-label="Next camera">
      <svg viewBox="0 0 24 48" aria-hidden="true"><polyline points="6,4 18,24 6,44" /></svg>
    </button>

    <button class="nv" id="nv" aria-label="Toggle night vision" aria-pressed="false">nv</button>
    <button class="emp" id="emp" aria-label="Fire the EMP at this room">emp</button>

    <div class="emp-flash" aria-hidden="true"></div>

    <!-- Title screen -->
    <section class="title" id="title">
      <a class="back" href="../">&lsaquo; games</a>
      <h1>crazyhouse</h1>
      <button class="start" id="start">START</button>
    </section>

    <p class="no-gl-msg">This game needs WebGL, and this browser isn't giving it any.</p>

  </div>

  <script type="module" src="main.js?v=51"></script>
</body>
</html>
